services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: decision_os
      POSTGRES_USER: decision
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decision -d decision_os"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    
  api:
    build: .
    command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8001:8000"]
    networks: [internal]
    
  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on: [api]
    ports: ["127.0.0.1:8502:8501"]
    networks: [internal]

secrets:
  db_password:
    file: ./secrets/db_password.txt
    
volumes:
  pg_data:
  
networks:
  internal: