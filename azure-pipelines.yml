trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10' # Adjust if your Decision OS uses a different version
  displayName: 'Set up Python environment'

# 1. Install Code Quality Tools
- script: |
    python -m pip install --upgrade pip
    pip install ruff
  displayName: 'Install Ruff (Code Quality)'

# 2. Run Ruff Linter
- script: |
    ruff check  . --exit-zero
  displayName: 'AIOps/Quality: Run Ruff Linter'

# 3. Install and Run Trivy
- script: |
    # Download and install the Trivy binary silently
    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    
    # Run a filesystem scan on your repository
    # The --exit-code 1 flag forces the pipeline to fail if HIGH or CRITICAL issues are found
    trivy fs . --severity HIGH,CRITICAL --exit-code 1
  displayName: 'DevSecOps: Run Trivy Vulnerability Scanner'